name: development CI

# Runs on every push and PR into development. Debug-level gate: fast feedback
# while iterating. Stricter release/deploy gates live in main.yml.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standards:
    name: coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/standards-check.sh

  android:
    name: android debug build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/gen-google-services.sh
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  functions:
    name: cloud functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
