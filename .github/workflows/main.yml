name: main deploy gate

# Stronger gate than development CI. Passing here means the tree is ready to be
# promoted to the deployment branch (from which Google Play and F-Droid pull).
# Adds: release-level build, Play Store bundle check, F-Droid readiness scan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standards:
    name: coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/standards-check.sh

  android-release:
    name: android release build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/gen-google-services.sh
      - run: chmod +x gradlew
      # Unsigned release build - proves the release variant compiles and lints
      # clean. Signing happens only on the deployment branch (deployment.yml).
      - run: ./gradlew assembleRelease testReleaseUnitTest lintRelease --stacktrace

  functions:
    name: cloud functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  play-store-readiness:
    name: play store bundle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/gen-google-services.sh
      - run: chmod +x gradlew
      # Play requires an AAB. Build it unsigned here just to confirm bundling
      # works; the signed, uploadable bundle is produced in deployment.yml.
      - run: ./gradlew bundleRelease --stacktrace
      - name: Verify versionCode is set
        run: |
          if ! grep -qE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts; then
            echo "::error::versionCode missing in app/build.gradle.kts"; exit 1
          fi
          grep -E 'versionCode|versionName' app/build.gradle.kts

  fdroid-readiness:
    name: f-droid readiness scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # F-Droid's main repo builds from source and rejects non-free
      # dependencies. This app currently depends on Firebase + Google Play
      # Services + ML Kit, which are proprietary. Report them so promotion is a
      # conscious decision, not a surprise rejection. Warn (do not fail) - a
      # GMS build can still ship via IzzyOnDroid or a Play-only release.
      - name: Scan for non-free dependencies
        run: |
          hits=$(grep -nE 'firebase|play-services|com\.google\.mlkit|gms' app/build.gradle.kts || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::warning::proprietary Google dependencies present - blocks F-Droid main repo inclusion (OK for IzzyOnDroid / Play). See specs/06 roadmap."
          else
            echo "no proprietary Google dependencies detected"
          fi

  deploy-gate:
    name: deploy gate (all checks green)
    runs-on: ubuntu-latest
    needs: [standards, android-release, functions, play-store-readiness, fdroid-readiness]
    steps:
      - run: echo "All promotion checks passed - main is ready for the deployment branch."
